services:
  postgres:
    image: postgres:16-alpine
    container_name: ordermgmt-postgres
    environment:
      POSTGRES_DB: order_management
      POSTGRES_USER: ordermgmt
      POSTGRES_PASSWORD: ordermgmt_pwd
    ports:
      - "5432:5432"
    volumes:
      - ordermgmt_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ordermgmt -d order_management"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ordermgmt_pgdata:
